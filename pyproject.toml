[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-suitability"
version = "0.2.0"
description = "CPU heuristic analysis of video suitability for object-centric 3D reconstruction"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24,<3",
  "opencv-python-headless>=4.8,<5",
]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]
ui = ["streamlit>=1.30,<2"]
ml-tabular = ["scikit-learn>=1.3,<2", "joblib>=1.3,<2"]
app-ml = [
  "streamlit>=1.30,<2",
  "scikit-learn>=1.3,<2",
  "joblib>=1.3,<2",
]
ml-deep = ["torch>=2.1,<3", "torchvision>=0.16,<1", "Pillow>=9,<12"]

[project.scripts]
video-suitability = "video_suitability.infer:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

